name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    # Ubuntu's GTK (4.14) is older than the bindings need (gtk4 4.21+,
    # libadwaita 1.9, webkitgtk-6.0 2.52). Arch rolling ships them all.
    container: archlinux:latest
    steps:
      - name: Install system deps
        run: pacman -Sy --noconfirm --needed base-devel git curl pkgconf gtk4 libadwaita webkitgtk-6.0
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
