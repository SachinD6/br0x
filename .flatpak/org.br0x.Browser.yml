app-id: org.br0x.Browser
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: br0x
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.portal.*
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
modules:
  - name: br0x
    buildsystem: simple
    # Local builds use the network. For Flathub, vendor crates with
    # flatpak-cargo-generator and list them under sources instead.
    sources:
      - type: dir
        path: ../..
    build-commands:
      - cargo build --release --locked -p br0x-shell-gtk
      - install -Dm755 target/release/br0x /app/bin/br0x
      - install -Dm644 packaging/org.br0x.Browser.desktop /app/share/applications/org.br0x.Browser.desktop
      - install -Dm644 packaging/org.br0x.Browser.metainfo.xml /app/share/metainfo/org.br0x.Browser.metainfo.xml
      - install -Dm644 packaging/org.br0x.Browser.svg /app/share/icons/hicolor/scalable/apps/org.br0x.Browser.svg
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/br0x/cargo
