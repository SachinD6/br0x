[package]
name = "br0x-shell-gtk"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "br0x"
path = "src/main.rs"

[dependencies]
br0x-core = { path = "../br0x-core" }
gtk4 = { version = "0.11", features = ["v4_22"] }
libadwaita = { version = "0.9", package = "libadwaita", features = ["v1_9"] }
webkit6 = { version = "0.6", features = ["v2_52"] }
